name: CI

on:
  push:
    branches: [hatchet3-dev]
  pull_request:
    branches: [hatchet3-dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-arm64
    steps:
      - uses: actions/checkout@v4

      # Build the real user environment from environment.yaml. conda's libmamba
      # solver uses full repodata (the sharded-repodata path drops packages such
      # as eido). miniforge + the file's `nodefaults` channel avoid the defaults
      # channel and its CI Terms-of-Service prompt.
      - name: Create conda env from environment.yaml
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yaml
          activate-environment: hatchet3
          auto-activate-base: false
          conda-solver: libmamba

      # --no-build-isolation compiles _hmm_cpp against the conda toolchain
      # (pybind11, cxx-compiler, and the platform OpenMP) instead of a PyPI copy.
      - name: Build and install HATCHet3 with test extra
        run: pip install --no-build-isolation ".[test]"

      - name: Report backend and solvers
        run: |
          python -c "import hatchet.cluster_bins.hmm as h; print('USE_CPP =', h._USE_CPP)"
          python -c "from pyomo import environ as pe; print('CBC =', pe.SolverFactory('cbc').available(exception_flag=False))"
          python -c "import snakemake, cnplot; print('snakemake', snakemake.__version__, '| cnplot', getattr(cnplot, '__version__', '?'))"

      - name: Run test suite
        run: pytest tests -v --durations=10 --cov=hatchet --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.1"
      - run: ruff check .
      - run: ruff format --check .
