##################################################
# HATCHet3 YAML configuration file
##################################################
# Input, absolute path
bb_dir: "/path/to/genotyped_dir/allele/bulkDNA"

# Output paths, relative to snakemake --directory
bbc_dir: "bbc"
result_dir: "results"
plot_dir: "summary"
log_dir: "logs"

##################################################
# Reference
genome_size: ""
region_bed: ""

##################################################
cluster_bins:
  # HMM cluster state range
  minK: 3
  maxK: 30
  # off-diagonal transition mass
  t: 1e-6
  # number of random restarts per K
  restarts: 30
  # number of top-scoring inits to run full EM on (null = same as restarts)
  top_restarts:
  # EM iterations per restart
  niters: 50

  # Beta-Binomial dispersion
  min_tau: 50
  max_tau: 200
  # BAF mean Brent search bounds [baf_eps, 1-baf_eps]
  baf_eps: 1.0e-3
  # minimum RDR variance floor
  min_covar: 1.0e-3
  # inverse-gamma prior shape for RDR variance
  ig_alpha: 10.0
  # number of EM iterations to update tau
  tau_iters: 1

  # use log(RDR) instead of RDR for Gaussian emission
  log_rdr: false

  # HMM decoding method: viterbi | map
  decode_method: "map"
  # model selection criterion: bic | icl
  score_method: "icl"
  # initialization method: cna_plus_plus | kmeans_plus_plus
  init_method: "cna_plus_plus"

  # balanced cluster interval LRT
  bal_lrt_alpha: 0.05
  bal_margin: 0.03

  # cluster variance-outlier filtering
  filter_std: 2.0
  min_nbins: 10
  ub_nbins: 50

##################################################
compute_cn:
  # manually select cluster_bins bbc/seg by cluster <k> (null = auto)
  k: null


  # solver mode: ilp | cd | both
  mode: cd
  # ILP solver backend: gurobi | cbc
  solver: gurobi
  # ILP solver timelimit in seconds (null = unlimited)
  timelimit: null

  # significance level for fractional CN confidence intervals
  fcn_ci_alpha: 0.05
  # hard minimum CI half-width in FCN space
  min_ci_margin: 0.1
  # fitting objective: imf (weighted L1) or ci (CI-violation hinge)
  obj_type: imf
  # model selection method: elbow | bic
  model_select: elbow

  # clone range
  minClone: 2
  maxClone: 4
  diploid: false
  tetraploid: false

  # regularization term: RAW | MAXCN | DBOX_L1 | DBOX_L0 | DROOT_SUM | DADJ_SUM
  reg_term: "MAXCN"
  reg_steps: 15
  reg_bound: 0.15

  # constraints
  # disable amp/del symmetry constraint
  no_ampdel: false
  # max distinct CN states per clone (-1 = unconstrained)
  num_cnstates: -1
  # max total copy number per ploidy
  diploidcmax: 8
  tetraploidcmax: 12
  # minimum clone proportion
  min_prop: 0.01
  # clusters with weight >= this fraction cannot have (0,0) CN
  zero_cn_thres: 0.001

  # per-sample tumor purity override (format: "sample1:0.8;sample2:0.7", null = inferred)
  purities:

  # user-specified fixed CN states (format: "cid:cA|cB;...", null = none)
  fix_cn_dip:
  fix_cn_tet:

  # Coordinate-descent parameters
  cd_niters: 10
  cd_convergence_iters: 2
  cd_nseeds: 400
  cd_njobs: 8
  cd_seed: 42
  cd_tol: 0.001
  u_init: "dirichlet"
  u_dir_alpha: 0.3
  solver_threads:

  # CNT-CD parameters
  tree_file:
  eps_fit: 0.01

##################################################
plot_cn:
  dpi: 500
  # output image format: png | pdf | svg
  img_type: png
  transparent: false
  keep_gap: false
  tail_alpha: 0.8
  center_alpha: 1.0
  onetail_area: 0.025
  # FCN axis upper limit
  maxlim_fcn: 30

##################################################
verbosity: 0
threads: 4
