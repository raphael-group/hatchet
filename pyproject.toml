[build-system]
requires = ["setuptools>=77", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchet"
dynamic = ["version"]
requires-python = ">=3.11"
description = "HATCHet: Holistic Allele-specific Tumor Copy-number Heterogeneity"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.22,<3",
    "scipy>=1.15",
    "pandas>=2,<3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.6",
    "numba>=0.61",
    "kneed>=0.8",
    "pyomo>=6.9",
    "adjustText>=1.3",
    "pyyaml>=6",
    "psutil>=5.9",
    "snakemake>=9",
    "cnplot @ git+https://github.com/raphael-group/cnplot.git@main",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hatchet = ["hatchet.yaml"]

[project.scripts]
hatchet = "hatchet.__main__:main"

[tool.ruff.lint]
# Pin the classic default rule set so lint is deterministic across ruff versions
# (newer ruff releases expand the implicit default select).
select = ["E4", "E7", "E9", "F"]
