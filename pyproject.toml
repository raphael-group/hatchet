[build-system]
requires = ["setuptools>=61", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchet"
version = "3.0.0"
requires-python = ">=3.11"
description = "HATCHet3: Holistic Allele-specific Tumor Copy-number Heterogeneity"
dependencies = [
    "numpy>=1.22,<3",
    "scipy>=1.15",
    "pandas>=2,<3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.6",
    "numba>=0.61",
    "kneed>=0.8",
    "pyomo>=6.9",
    "adjustText>=1.3",
    "pyyaml>=6",
    "psutil>=5.9",
    "cnplot @ git+https://github.com/raphael-group/cnplot.git@v0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hatchet = ["hatchet.yaml"]

[project.scripts]
hatchet = "hatchet.__main__:main"
