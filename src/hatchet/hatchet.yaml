# HATCHet3 default parameter values for all subcommands.
# Loaded by hatchet.utils.normalize_args at the top of each run().

##################################################
# global
# verbosity: 0 | 1 | 2
verbosity: 0

##################################################
# cluster-bins
force: false
minK: 3
maxK: 30
t: 1.0e-6
restarts: 10
top_restarts: null
n_local_trials: 3
niters: 50
# decode_method: viterbi | map
decode_method: map
# score_method: bic | icl
score_method: icl
# score_criteria: min | elbow | margin-<int>  (how to pick K from the score curve)
score_criteria: min
# init_method: cna_plus_plus | kmeans_plus_plus
init_method: cna_plus_plus
free_baf_c0: false
# training_method: baum_welch | viterbi
training_method: baum_welch
min_tau: 1.0
max_tau: 1.0e+6
share_tau: true
baf_eps: 1.0e-3
min_covar: 1.0e-3
ig_alpha: 10.0
tau_iters: 3
seed: 42
log_rdr: false
bal_lrt_alpha: 0.05
bal_margin: 0.03
filter_std: 2.0
min_nbins: 10
ub_nbins: 50
skip_mhbafs: false

##################################################
# compute-cn
# mode: ilp | cd | both | cnt_cd
mode: ilp
# model_select: elbow | bic
model_select: bic
# solver: gurobi | cbc
solver: gurobi
timelimit: null
fcn_ci_alpha: 0.05
min_ci_margin: 0.1
# obj_type: imf | ci
obj_type: imf
minClone: 2
maxClone: 4
diploid: false
tetraploid: false
# reg_term: RAW | MAXCN | DBOX_L1 | DBOX_L0 | DROOT_SUM | DADJ_SUM
reg_term: MAXCN
reg_steps: 15
reg_bound: 0.15
fix_cn_dip: null
fix_cn_tet: null
zero_cn_thres: 0.001
cd_tol: 0.001
tol: 0.001
no_ampdel: false
num_cnstates: -1
diploidcmax: 8
tetraploidcmax: 12
min_prop: 0.01
purities: null
cd_niters: 10
cd_convergence_iters: 2
cd_nseeds: 400
cd_njobs: 8
cd_seed: 42
# u_init: dirichlet | bubble | bin_dir
u_init: dirichlet
u_dir_alpha: 0.3
# bin_dir only: Bernoulli presence prob for non-anchor cells
u_bin_p: 0.5
solver_threads: null
eps_fit: 0.01

##################################################
# plot-cn / plot-panel (shared --dpi default)
dpi: 300
# img_type: pdf | png | svg
img_type: png
transparent: false
keep_gap: false
tail_alpha: 0.8
center_alpha: 1.0
onetail_area: 0.025
maxlim_fcn: 30
plot_ascn: false
patient_id: panel
# combined 1D figure width (inches)
plot_row_width: 25
# per-sample vertical block height (inches)
plot_row_height: 6
# vertical gap between samples (GridSpec hspace)
plot_inter_sample_hspace: 0.35
# vertical gap between FCN and BAF within a sample
plot_intra_sample_hspace: 0.12
# vertical gap between last BAF row and CNP profile
plot_baf_cnp_hspace: 0.15
# vertical gap between CNP profile and ASCN legend
plot_cnp_legend_hspace: 0.15
# font size of the per-sample title above each FCN row
plot_title_fontsize: 14
# font size of FCN / mhBAF y-axis labels
plot_ylabel_fontsize: 12
# font size of chromosome name labels on BAF row
plot_chrname_fontsize: 13
# font size of clone-name and chrname on CNP profile
plot_cnp_label_fontsize: 11
# font size of A / B sublabel on CNP minor y-ticks
plot_cnp_ab_fontsize: 9
# ASCN legend: per-state box width (axis units)
plot_legend_box_w: 1.2
# ASCN legend: per-state box height (axis units)
plot_legend_box_h: 0.4
# ASCN legend: tick mark length below each box
plot_legend_tick_len: 0.08
# ASCN legend: label font size
plot_legend_label_fontsize: 12

##################################################
# plot-panel
width: 20
height: 1
show_clone_name: false
show_prop: false
title: panel
plot_1d2d: false
plot_summary: false

##################################################
# evaluate
vcf_sample: tumor
gamma: 0.05
min_vaf: 0.0
min_depth: 5
eval_all: false
