# HATCHet3 default parameter values for all subcommands.
# Loaded by hatchet.utils.normalize_args at the top of each run().

##################################################
# global
# verbosity: 0 | 1 | 2
verbosity: 0

##################################################
# cluster-bins
force: false
minK: 3
maxK: 30
t: 1.0e-6
restarts: 10
top_restarts: null
n_local_trials: 3
niters: 50
# decode_method: viterbi | map
decode_method: map
# score_method: bic | icl
score_method: icl
# score_criteria: min | elbow | margin-<int>  (how to pick K from the score curve)
score_criteria: min
# init_method: cna_plus_plus | kmeans_plus_plus
init_method: cna_plus_plus
free_baf_c0: false
# training_method: baum_welch | viterbi
training_method: baum_welch
min_tau: 1.0
max_tau: 1.0e+6
share_tau: true
baf_eps: 1.0e-3
min_covar: 1.0e-3
ig_alpha: 10.0
tau_iters: 3
seed: 42
log_rdr: false
bal_lrt_alpha: 0.05
bal_margin: 0.03
filter_std: 2.0
min_nbins: 10
ub_nbins: 50
skip_mhbafs: false

##################################################
# compute-cn
# mode: ilp | cd | both
mode: cd
# model_select: elbow | bic
model_select: bic
# solver: gurobi | cbc
solver: gurobi
timelimit: null
fcn_ci_alpha: 0.05
min_ci_margin: 0.1
# obj_type: imf | ci
obj_type: imf
minClone: 2
maxClone: 6
diploid: false
tetraploid: false
# reg_term: RAW | MAXCN | DBOX_L1 | DBOX_L0 | DROOT_SUM | DADJ_SUM
reg_term: DBOX_L1
reg_steps: 15
reg_bound: 0.15
fix_cn_dip: null
fix_cn_tet: null
zero_cn_thres: 0.001
cd_tol: 0.001
tol: 0.001
no_ampdel: false
num_cnstates: -1
diploidcmax: 8
tetraploidcmax: 12
min_prop: 0.01
purities: null
cd_niters: 10
cd_convergence_iters: 2
cd_nseeds: 400
cd_njobs: 8
cd_seed: 42
# u_init: dirichlet | bubble
u_init: dirichlet
u_dir_alpha: 0.3
solver_threads: null
eps_fit: 0.01

##################################################
# plotting (shared: cluster-bins plot-rdr-baf + plot-cn + plot-panel)
plot_dpi: 300
# plot_img_type: pdf | png | svg
plot_img_type: png
plot_transparent: false
plot_show_gap: false

# transparent outlier dots
plot_tail_alpha: 0.8
plot_center_alpha: 1.0
plot_onetail_area: 0.025
plot_maxlim_fcn: 30
patient_id: panel
# combined 1D figure width (inches)
plot_row_width: 25
# per-sample vertical block height (inches)
plot_row_height: 4
# vertical gap between samples; fraction of a full (n_rows-tall) sample block
plot_inter_sample_hspace: 0.15
# vertical gap between the two rows within a sample; fraction of one row
plot_intra_sample_hspace: 0.05
# vertical gap between last BAF row and CNP profile (plot-cn only)
plot_baf_cnp_hspace: 0.15
# dot marker size
plot_markersize: 5
# legend marker size
plot_legend_markersize: 5
plot_legend_fontsize: 8
plot_maxlim_rdr: 100
# cluster-bins per-cluster diagnostic pages (plot_clusters)
plot_diag_col_width: 7
plot_diag_page_height: 12
plot_diag_hist_bins: 80
plot_diag_scatter_size: 4
plot_diag_scatter_alpha: 0.3
plot_diag_contour_levels: 6
plot_diag_suptitle_fontsize: 14
plot_diag_title_fontsize: 10
plot_diag_label_fontsize: 9
plot_diag_legend_fontsize: 7

##################################################
# plot-panel
plot_panel_width: 20
plot_panel_height: 1
show_clone_name: false
show_ploidy: false
title: panel
plot_1d2d: false
plot_summary: false

##################################################
# evaluate
vcf_sample: tumor
gamma: 0.05
min_vaf: 0.0
min_depth: 5
eval_all: false
